name: build-msix
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Restaurar dependencias
        run: dotnet restore MyProgress.csproj -r win-x64

      - name: Decodificar certificado de firma
        shell: powershell
        run: |
          $pfxBytes = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          [System.IO.File]::WriteAllBytes("cert.pfx", $pfxBytes)

      - name: Compilar y firmar MSIX
        run: >
          msbuild MyProgress.csproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir="out/"
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile="cert.pfx"
          /p:PackageCertificatePassword="${{ secrets.PFX_PASSWORD }}"

      - name: Limpiar archivo temporal de certificado
        if: always()
        shell: powershell
        run: |
          if (Test-Path "cert.pfx") { Remove-Item "cert.pfx" -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: MyProgress-msix
          path: out/**
