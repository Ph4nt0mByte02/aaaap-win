name: build-msix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild MyProgress.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never /p:AppxPackageDir=out\
      - uses: actions/upload-artifact@v4
        with: { name: MyProgress-msix, path: out/** }
